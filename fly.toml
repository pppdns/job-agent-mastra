# Fly.io app: one always-on machine, one volume. See docs/deploy.md.
app = "job-copilot-c456e8"
primary_region = "fra"
# Next build + DuckDB headroom on a 1 GB machine.
swap_size_mb = 1024

[build]

[deploy]
  # One volume = one machine: replace it in place instead of rolling.
  strategy = "immediate"

[env]
  NODE_ENV = "production"
  LLM_MODE = "live"
  DATABASE_URL = "file:/data/copilot.db"
  AGENT_PORT = "4111"
  # Private network only (for `fly proxy 4111`); the public service is port 3000 alone.
  AGENT_HOST = "::"
  WEB_PORT = "3000"

[mounts]
  source = "copilot_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: scheduled workflows (job discovery) run inside this process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/login"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
