# Checks, then deploys to Fly.io on every push to main (see docs/deploy.md).
# Needs one repo secret: FLY_API_TOKEN (a deploy token scoped to this app).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # Tags Sentry events with the commit; SENTRY_AUTH_TOKEN (optional repo secret) uploads the
      # web app's source maps during the image build.
      - run: |
          args=(--build-arg "SENTRY_RELEASE=$GITHUB_SHA")
          if [[ -n "$SENTRY_AUTH_TOKEN" ]]; then args+=(--build-secret "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"); fi
          flyctl deploy --remote-only "${args[@]}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
